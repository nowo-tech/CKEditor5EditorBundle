services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\Ckeditor5EditorBundle\Twig\NowoCkeditor5EditorTwigExtension:
        tags: ['twig.extension']

    Nowo\Ckeditor5EditorBundle\Form\Ckeditor5EditorType:
        arguments:
            $profiles: '%nowo_ckeditor5_editor.profiles%'
            $defaultProfileName: '%nowo_ckeditor5_editor.default_profile%'
            $csrfTokenManager: '@security.csrf.token_manager'
        tags:
            - { name: form.type }
