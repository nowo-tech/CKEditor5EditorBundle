  theme_toggle_title: 'Toggle demo dark mode'
  theme_dark: 'Dark'
  theme_light: 'Light'
  page_home_title: 'CKEditor 5 rich text'
  page_home_lead: 'Symfony form field using <a href="https://ckeditor.com/ckeditor-5/">CKEditor 5</a> (GPL open-source build via Vite), similar to FriendsofSymfony CKEditor workflows.'
  body_label: 'Content'
  saved: 'Content saved.'
  saved_configs: 'All editors saved.'
  saved_variants: 'All variant editors saved.'
  submit: 'Save'
  submit_all: 'Save all'
  saved_preview: 'Submitted HTML (escaped preview):'
  configs_page_title: 'Named YAML profiles'
  configs_page_lead: 'Profiles full → standard, simple, minimal — see config/packages/nowo_ckeditor5_editor.yaml. More heights, themes, env vars on Variants.'
  inline_config_page_title: 'Merge profile in PHP (`editor_config`)'
  inline_config_page_lead: 'This page uses YAML profile **minimal**, then overrides **preset** and **min_height** via the form option `editor_config` (same keys as in nowo_ckeditor5_editor). Explicit options `toolbar`, `min_height`, `height`, `theme` on the field still win over merged values.'
  inline_config_field_label: 'Editor (minimal → overridden)'
  inline_config_field_help: '`config: minimal` plus `editor_config` with preset standard and responsive min-height.'
  inline_config_sample_html: 'You should see the standard toolbar (tables, etc.) and a taller editing area — not the bare minimal preset.'
  inline_config_note_title: 'Same snippet as in CkeditorDemoController'
  inline_config_note_snippet: |
    ->add('content', Ckeditor5EditorType::class, [
        'config' => 'minimal',
        'editor_config' => [
            'preset' => 'standard',
            'min_height' => 'min(32vh, 480px)',
        ],
    ]);
  variants_page_title: 'Heights, themes & variables'
  variants_page_lead: 'compact & folio min-heights (parameters), folio height from .env, dark & auto chrome, reading mode without toolbar.'
  variants_yaml_note_title: 'Where this is configured'
  variants_yaml_snippet: |
    # config/packages/demo_ckeditor_parameters.yaml
    parameters:
        demo.ckeditor.height.compact: '112px'
        demo.ckeditor.height.folio: 'min(72vh, 720px)'

    # config/packages/nowo_ckeditor5_editor.yaml — folio_env uses:
    # min_height: '%env(DEMO_CKEDITOR_FOLIO_MIN_HEIGHT)%'

    # .env
    # DEMO_CKEDITOR_FOLIO_MIN_HEIGHT=min(68vh, 620px)
  section_standard: 'standard preset (tables, images URL, alignment…)'
  section_standard_hint: 'Config profile “full” → preset standard.'
  section_simple: 'simple preset'
  section_simple_hint: 'Profile “simple” → headings, lists, quotes, code blocks — no tables/images.'
  section_minimal: 'minimal preset'
  section_minimal_hint: 'Profile “minimal” → bold, italic, link, lists only.'
  section_heights: 'Min-height: compact, folio, folio from env'
  section_heights_hint: 'compact uses %demo.ckeditor.height.compact%; folio uses %demo.ckeditor.height.folio%; folio_env uses DEMO_CKEDITOR_FOLIO_MIN_HEIGHT.'
  section_themes: 'Chrome theme: dark & auto'
  section_themes_hint: 'dark_note forces dark wrapper; auto_panel follows prefers-color-scheme when theme is auto.'
  section_misc: 'Reading mode (no toolbar)'
  section_misc_hint: 'toolbar: false — editable region only, preset simple.'
  profile_standard_label: 'Standard build'
  profile_standard_help: 'Tables, image via URL, alignment, todo lists — OSS plugins only.'
  profile_simple_label: 'Simple'
  profile_simple_help: 'Medium toolbar without tables or images.'
  profile_minimal_label: 'Minimal'
  profile_minimal_help: 'Bold, italic, link, bullet/numbered lists.'
  variant_compact_label: 'Compact height'
  variant_compact_help: 'Profile compact — ~112px min-height via parameter.'
  variant_folio_label: 'Folio / long document'
  variant_folio_help: 'Profile folio — tall editable area min(72vh, 720px) for contracts or long copy.'
  variant_folio_env_label: 'Folio height from environment'
  variant_folio_env_help: 'Profile folio_env — min_height from DEMO_CKEDITOR_FOLIO_MIN_HEIGHT in .env.'
  variant_dark_label: 'Dark chrome'
  variant_dark_help: 'Profile dark_note — theme: dark on the widget wrapper.'
  variant_auto_label: 'Auto chrome'
  variant_auto_help: 'Profile auto_panel — theme: auto (uses OS light/dark preference).'
  variant_reading_label: 'Reading mode'
  variant_reading_help: 'Profile reading_mode — toolbar disabled, simple preset, spacious min-height.'
  sample_standard: 'Standard preset — rich toolbar with tables and insert image (URL).'
  sample_simple: 'Simple preset — headings, lists, block quote, code.'
  sample_minimal: 'Minimal preset — lightweight toolbar.'
  sample_compact: 'Compact — short editor for captions or inline notes.'
  sample_folio: 'Folio — scroll-friendly height for long legal or editorial content.'
  sample_folio_env: 'Same preset as folio; height is driven by DEMO_CKEDITOR_FOLIO_MIN_HEIGHT.'
  sample_dark: 'Dark wrapper — good on dark pages or beside dark UI.'
  sample_auto: 'Auto theme — matches system light/dark when the wrapper uses theme auto.'
  sample_reading: 'Reading mode — focus on text without toolbar clutter.'
  emoji_page_title: 'Emoji picker'
  emoji_page_lead: 'Toolbar emoji button opens the grid; after a space, type : and letters for suggestions. Emoji definitions load from CKEditor CDN — allow network access and adjust CSP if needed.'
  emoji_field_label: 'Rich message'
  emoji_field_help: 'Profile with_emoji uses preset emoji (simple tools + Emoji + Mention for “:” completion).'
  emoji_sample_html: "Try the emoji toolbar button or type :sm after a word boundary / space for suggestions."
  emoji_config_note_title: 'YAML (preset: emoji)'
  emoji_config_snippet: |
    with_emoji:
        preset: emoji
        toolbar: true
        min_height: 260px
  typography_page_title: 'Fonts & sizes'
  typography_page_lead: 'Font family and font size dropdowns (inline styles). Lists are defined in the Vite bundle for preset typography — extend or override via your own fork of ckeditor5-editor.ts if needed.'
  typography_field_label: 'Styled content'
  typography_field_help: 'Profile typography_styled uses preset typography (FontFamily + FontSize + RemoveFormat).'
  typography_sample_html: "Select text and choose another font or size from the toolbar."
  typography_config_note_title: 'YAML (preset: typography)'
  typography_config_snippet: |
    typography_styled:
        preset: typography
        toolbar: true
        min_height: 280px
  variables_page_title: 'Template variables (@)'
  variables_page_lead: 'Type @ in the text to open a list of merge-style placeholders (first name, email, policy number…). They are stored as CKEditor «mention» markup in the HTML — replace or resolve them in your app when rendering emails or PDFs. The feed is defined in the bundle Vite build (ckeditor5-editor.ts); fork it to add your own keys.'
  variables_field_label: 'Body with variables'
  variables_field_help: 'Profile with_variables uses preset variables (Mention with an @ feed).'
  variables_sample_html: 'Type @ — pick a variable from the list, then save to inspect the HTML below.'
  variables_config_note_title: 'YAML (preset: variables)'
  variables_config_snippet: |
    with_variables:
        preset: variables
        toolbar: true
        min_height: 280px
  upload_images_page_title: 'Image upload & recovery'
  upload_images_page_lead: 'Insert images from the toolbar; files are POSTed to /upload/ckeditor with a CSRF header. The endpoint stores files under public/uploads/ckeditor and returns an absolute URL. After save, the HTML below shows those URLs — reload the page and submit again to confirm images still load.'
  upload_images_field_label: 'Content with uploads'
  upload_images_field_help: 'Profile with_image_upload uses preset standard plus upload_url for SimpleUploadAdapter.'
  upload_images_sample_html: 'Use Insert image → Upload, pick a JPEG/PNG/WebP/GIF (max 5 MB). Save to see escaped HTML and a rendered preview.'
  upload_images_rendered_preview: 'Rendered preview (same HTML returned by the form):'
  upload_images_config_note_title: 'YAML (preset standard + upload_url)'
  upload_images_config_snippet: |
    with_image_upload:
        preset: standard
        toolbar: true
        min_height: 360px
        upload_url: '/upload/ckeditor'
