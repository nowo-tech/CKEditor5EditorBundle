# nowo_ckeditor5_editor — CKEditor 5 (GPL OSS) widget options
#
# preset: standard | simple | minimal | emoji | typography | variables — Vite bundle plugins + toolbar.
# theme:  light | dark | auto — wrapper palette (independent of the demo navbar dark toggle).
# min_height: CSS value; use %demo.ckeditor.height.*% or %env(DEMO_CKEDITOR_FOLIO_MIN_HEIGHT)% (see .env)

nowo_ckeditor5_editor:
    default_profile: simple
    profiles:
        full:
            preset: standard
            toolbar: true
            min_height: 300px
            form_theme: form_div_layout.html.twig
            debug: true
            theme: light
        simple:
            preset: simple
            toolbar: true
            min_height: 220px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        minimal:
            preset: minimal
            toolbar: true
            min_height: 180px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        compact:
            preset: simple
            toolbar: true
            min_height: '%demo.ckeditor.height.compact%'
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        folio:
            preset: standard
            toolbar: true
            min_height: '%demo.ckeditor.height.folio%'
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        folio_env:
            preset: standard
            toolbar: true
            min_height: '%env(DEMO_CKEDITOR_FOLIO_MIN_HEIGHT)%'
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        dark_note:
            preset: simple
            toolbar: true
            min_height: 260px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: dark
        auto_panel:
            preset: minimal
            toolbar: true
            min_height: 200px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: auto
        reading_mode:
            preset: simple
            toolbar: false
            min_height: 320px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        with_emoji:
            preset: emoji
            toolbar: true
            min_height: 260px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        typography_styled:
            preset: typography
            toolbar: true
            min_height: 280px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        with_variables:
            preset: variables
            toolbar: true
            min_height: 280px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
        with_image_upload:
            preset: standard
            toolbar: true
            min_height: 360px
            form_theme: form_div_layout.html.twig
            debug: false
            theme: light
            upload_url: '/upload/ckeditor'
